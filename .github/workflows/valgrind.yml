name: Valgrind

on:
  workflow_dispatch:
  push:
    branches: [valgrind]

jobs:
  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make qtbase5-dev qt5-qmake valgrind

      - name: Build
        run: |
          mkdir -p qbuild
          cd qbuild
          qmake ../SAT_DPLL/laba_SAT1.pro CONFIG+=debug
          make -j"$(nproc)"

      - name: Run Valgrind
        run: |
          cd qbuild
          cp ../SAT_DPLL/SatExamples/Sat_ex14_3.pla Sat_ex30_3.pla
          valgrind --leak-check=full --show-leak-kinds=definite,indirect --track-origins=yes \
            --log-file=../valgrind_report.txt ./laba_SAT1 || true

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-report
          path: valgrind_report.txt
